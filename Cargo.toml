[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
filer-core = { path = "crates/core" }
filer-shell = { path = "crates/shell" }
filer-store = { path = "crates/store" }
gpui = "=0.2.2"
windows = "0.61"

[profile.release]
debug = 1
