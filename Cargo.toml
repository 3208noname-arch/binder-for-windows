[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
filer-core = { path = "crates/core" }
filer-shell = { path = "crates/shell" }
filer-store = { path = "crates/store" }
gpui = "=0.2.2"
windows = "0.61"

[profile.release]
debug = 1

[patch.crates-io]
gpui = { path = "vendor/gpui" }

